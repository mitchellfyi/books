<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>5MinBooks</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22><text y=%2252%22 font-size=%2252%22>📗</text></svg>">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<a class="skip-link" href="#book-detail">Skip to the book</a>
<header class="topbar">
  <a class="brand" href="./">5MinBooks</a>
  <label class="search">
    <span class="sr-only">Search books</span>
    <input id="search" type="search" placeholder="Search title, author, tag, or topic" autocomplete="off">
  </label>
  <button class="quiet-button" id="playlist-toggle" type="button" aria-expanded="false" aria-controls="playlist">Playlist (<span id="playlist-count">0</span>)</button>
</header>

<div class="shell">
  <aside class="sidebar">
    <div class="library-controls">
      <p class="eyebrow" id="filter-summary">Loading…</p>
      <label class="sort-control">
        <span>Sort by</span>
        <select id="book-sort">
          <option value="rating">Rating: high to low</option>
          <option value="title">Title: A–Z</option>
        </select>
      </label>
    </div>
    <nav id="book-list" aria-label="Books"></nav>
  </aside>
  <main id="book-detail" tabindex="-1"></main>
</div>

<p class="toast" id="status" role="status" aria-live="polite"></p>

<aside class="playlist" id="playlist" hidden aria-label="Playlist" role="dialog" aria-modal="true">
  <div class="panel-heading">
    <h2>Playlist</h2>
    <button class="icon-button" id="playlist-close" type="button" aria-label="Close">×</button>
  </div>
  <p class="muted" id="playlist-hint"></p>
  <ol id="playlist-items"></ol>
  <div class="action-row">
    <button class="quiet-button" id="playlist-save" type="button">Save as…</button>
    <button class="quiet-button" id="playlist-clear" type="button">Clear</button>
  </div>
  <div class="panel-heading"><h2>Saved</h2></div>
  <ol id="saved-lists"></ol>
</aside>

<footer class="player" id="player" hidden>
  <div>
    <strong id="player-title"></strong>
    <span class="muted" id="player-level"></span>
  </div>
  <audio id="audio" controls preload="metadata"></audio>
  <span class="player-selects">
    <label>
      <span class="sr-only">Voice</span>
      <select id="voice" title="Narration voice"></select>
    </label>
    <label>
      <span class="sr-only">Playback speed</span>
      <select id="speed" title="Playback speed"></select>
    </label>
  </span>
</footer>

<template id="empty-state">
  <section class="empty">
    <h1>No matching books</h1>
    <p class="muted">Adjust the search, or add a book with <code>./bookflow init --title "…" --author "…"</code>.</p>
  </section>
</template>

<script src="app.js"></script>
</body>
</html>
