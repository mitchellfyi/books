# The stock nginx:1.30-alpine server, plus the site's response headers.
# Cloudflare redirects plain HTTP to HTTPS at the edge, so every browser
# request reaches this server over HTTPS; browsers ignore HSTS on HTTP.
# No preload directive: the domain is not on the HSTS preload list.
server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    # Keep add_header out of the location blocks: one there would replace
    # this header instead of adding to it.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
