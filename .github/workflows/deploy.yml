name: Deploy to GitHub Pages

# Every push to main validates the library and publishes the static site.
#
# Narration audio is committed, so the runner has it and the published site
# serves it. That makes this checkout and artifact roughly 620 MB, against a
# 1 GB GitHub Pages limit — the number to watch as the library grows.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One publish at a time. A newer push waits rather than cancelling a run that
# is already deploying, so the site is never left half-written.
concurrency:
  group: pages
  cancel-in-progress: false

# Actions are pinned to exact releases, not floating majors: setup-uv is on
# v10 and publishes no v10 tag to float against, and a deploy pipeline is the
# last place to want a dependency moving under it.

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          # There is no lockfile: the dependencies live in check.py's inline
          # script metadata and in the `uv run --with` lines that `test` uses.
          # Without naming them the cache has nothing to key on and would never
          # invalidate.
          cache-dependency-glob: |
            bookflow
            scripts/check.py

      - name: Test and lint the tooling
        run: ./bookflow test

      - name: Validate the library
        # Strict: the recordings are committed, so the runner has them and a
        # completed book missing its audio is a real defect here, not a fact
        # about the environment.
        run: ./bookflow check

      - name: Build the site
        run: ./bookflow build

      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.0
