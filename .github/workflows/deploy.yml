name: Deploy through Ops

# Every push to main validates the library and asks Ops to build and publish
# that immutable revision on the Ubuntu workload host.
#
# Narration audio is committed, so the runner and the deployment build both
# have the recording files they need.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: platform-9b33968b-ef5f-4d06-aaaa-934b1513cafe-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to exact releases, not floating majors: setup-uv is on
# v10 and publishes no v10 tag to float against, and a deploy pipeline is the
# last place to want a dependency moving under it.

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          # There is no lockfile: the dependencies live in check.py's inline
          # script metadata and in the `uv run --with` lines that `test` uses.
          # Without naming them the cache has nothing to key on and would never
          # invalidate.
          cache-dependency-glob: |
            bookflow
            scripts/check.py

      - name: Test and lint the tooling
        run: ./bookflow test

      - name: Validate the library
        # Strict: the recordings are committed, so the runner has them and a
        # completed book missing its audio is a real defect here, not a fact
        # about the environment.
        run: ./bookflow check

      - name: Build the site
        run: ./bookflow build

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Queue the immutable commit with a short-lived GitHub identity
        shell: bash
        env:
          PLATFORM_AUDIENCE: https://ops.m12n.org/deploy
          PLATFORM_URL: https://ops.m12n.org
          PLATFORM_WORKLOAD_ID: 9b33968b-ef5f-4d06-aaaa-934b1513cafe
        run: |
          set -Eeuo pipefail
          request_headers="$(mktemp)"
          deploy_headers="$(mktemp)"
          deploy_payload="$(mktemp)"
          trap 'rm -f "$request_headers" "$deploy_headers" "$deploy_payload"' EXIT
          chmod 600 "$request_headers" "$deploy_headers" "$deploy_payload"
          printf 'Authorization: bearer %s\n' "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" > "$request_headers"
          token_response="$(curl --fail --silent --show-error \
            --header "@$request_headers" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${PLATFORM_AUDIENCE}")"
          oidc_token="$(jq -er '.value' <<<"$token_response")"
          printf 'Authorization: Bearer %s\nContent-Type: application/json\n' \
            "$oidc_token" > "$deploy_headers"
          jq -nc --arg workload_id "$PLATFORM_WORKLOAD_ID" \
            '{workload_id:$workload_id}' > "$deploy_payload"
          curl --fail --silent --show-error \
            --header "@$deploy_headers" \
            --data-binary "@$deploy_payload" \
            "$PLATFORM_URL/api/v1/deployments"
