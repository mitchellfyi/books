# Managed by DexCode template dependabot-guard@1.6.2. Edit the template, not this file.
#
# What this does, and deliberately does not do.
#
# Patch and minor updates are merged by DexCode, not by this workflow. A merge
# made with this workflow's GITHUB_TOKEN starts no CI and no deployment on the
# default branch, so before 1.6.0 every update the guard merged reached
# production only when somebody else next pushed. The sweep asks DexCode with
# a GitHub OIDC token; DexCode re-checks the pull request and its CI itself and
# merges with its GitHub App token, pinned to the head the sweep saw.
#
# The sweep asks only when GitHub reports the update CLEAN or HAS_HOOKS and CI
# outside this workflow has passed on that exact head. Failed, pending, absent
# or unreadable checks never lead to a merge. One update merges per run: each
# merge moves main under the rest. A request whose outcome is unknown counts as
# a possible merge, so it also ends the asking for that run. Everything left
# open is named in the run summary with its reason.
#
# Major updates are never merged. A major bump can pass every check and still
# change behaviour, and a dependency file is the one place where a green tick
# is weakest evidence. They are left for a person, and labelled when GitHub
# lets this workflow label them (see the permissions below). Whether an update
# is a major comes from Dependabot's own `update-type` metadata in its commit,
# the record DexCode checks too, never from the pull request's body.
#
# Nothing in this workflow checks out or executes the pull request's code, and
# it cannot write code or pull requests. It reads Dependabot's metadata, tries
# to write labels and comments, and asks DexCode. A label or comment that
# GitHub refuses is reported and never stops the run: merging the rest of the
# backlog does not depend on either.
name: DexCode Dependabot guard

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # A pull request opened before this workflow existed will never send an
  # event, so without a sweep the whole backlog sits untouched for ever and
  # only new updates are handled. The offset minute is deliberate: GitHub drops
  # scheduled runs that pile up on the hour.
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

# Least privilege at the root; the jobs that need write say so themselves.
permissions: {}

concurrency:
  # One group per pull request for the event path, one for the whole sweep.
  # Sharing a group would let a sweep cancel the guard that a freshly opened
  # pull request just started.
  group: dexcode-dependabot-${{ github.event.pull_request.number || 'sweep' }}
  cancel-in-progress: true

jobs:
  guard:
    # Check-run names are job names, not workflow-qualified names. These two
    # names identify this workflow's own checks in the CI gates below, so they
    # must not be generic words such as "guard" that another workflow may use.
    name: dexcode-dependabot-guard
    # Author, not title: anyone can open a pull request called "bump x".
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    # This path only labels. Merging happens in the sweep, through DexCode,
    # so nothing here can write code or pull requests.
    permissions:
      contents: read
      pull-requests: read
      # Creates the repository's labels. It does not let the token put a label
      # or comment on a pull request: GitHub answered that with HTTP 403
      # ("Resource not accessible by integration") on dayz.cx's 10 October
      # 2026 sweep, because that needs `pull-requests: write`, which ADR 0014
      # withholds on purpose. So labelling a pull request may be refused, and
      # the steps below report that without failing.
      issues: write
    steps:
      - name: Read Dependabot's metadata for this pull request
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # DexCode's own files are published by DexCode and verified byte for
      # byte before a planning run is given its specification. An action pin
      # inside dexcode_plan.yml is part of that published content, so merging
      # Dependabot's bump of it changes the checksum, marks the installation
      # drifted, and every planning run afterwards is refused with a bare 401.
      #
      # The pin is DexCode's to move, in a template release. Not this
      # repository's, and not one dependency at a time.
      - name: Check whether this touches DexCode's managed files
        id: managed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          touched="$(gh pr view "${PR_NUMBER}" --json files \
            --jq '[.files[].path | select(test("^\\.github/workflows/dexcode_|^\\.dex/|^\\.dex-implementation/|^\\.github/workflows/platform-deploy\\.yml$|^\\.ops-agent/"))] | join(", ")')"
          if [ -n "${touched}" ]; then
            echo "touched=true" >> "${GITHUB_OUTPUT}"
            echo "paths=${touched}" >> "${GITHUB_OUTPUT}"
          else
            echo "touched=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Leave a DexCode-managed file for a template release
        if: steps.managed.outputs.touched == 'true'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PATHS: ${{ steps.managed.outputs.paths }}
        run: |
          set -euo pipefail
          # A label and a comment are a courtesy: the update is left alone
          # either way. GitHub refuses them to a token without
          # `pull-requests: write`, which this workflow does not hold, so a
          # refusal is reported in flag_error and never fails the run. An
          # earlier version exited here and turned a refused label into a
          # failed run that stopped every other update from merging.
          flag_error=""
          flag() { # pull request, label, colour, description, comment
            local out step
            if ! out="$(gh label create "$2" --color "$3" --description "$4" 2>&1)" &&
               [[ "${out}" != *"already exists"* ]]; then
              step="not labelled"
            elif ! out="$(gh api --method POST "repos/${GH_REPO}/issues/$1/labels" -f "labels[]=$2" 2>&1 > /dev/null)"; then
              step="not labelled"
            elif ! out="$(gh api --method POST "repos/${GH_REPO}/issues/$1/comments" -f body="$5" 2>&1 > /dev/null)"; then
              step="labelled, but not commented"
            else
              return 0
            fi
            # Printed to the log and the run summary, so only plain
            # characters: nothing that could start a workflow command.
            flag_error="${step}: $(printf '%s' "${out}" | tr '\n' ' ' | tr -cd 'A-Za-z0-9 ._/(),+?-' | head -c 160 || true)"
            return 1
          }
          if ! gh pr view "${PR_NUMBER}" --json labels --jq '[.labels[].name]' | grep -q "dexcode:managed-file"; then
            if ! flag "${PR_NUMBER}" "dexcode:managed-file" "0E8A16" \
                "Changes a DexCode- or Ops-managed file — update the template instead" \
                "DexCode will not merge this: it changes \`${PATHS}\`, which is published from a DexCode or Ops template. DexCode verifies its own files byte for byte before each planning run, so merging would mark this repository's installation as drifted and refuse every planning run; Ops renders the deploy workflow and agent relay. The pin moves in a template release instead."; then
              echo "::notice::#${PR_NUMBER}: ${flag_error}"
            fi
          fi
          echo "::notice::Left alone: changes managed ${PATHS}"

      - name: Leave a major update for a person
        if: |
          steps.managed.outputs.touched != 'true' &&
          steps.meta.outputs.update-type == 'version-update:semver-major'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          DEPENDENCY: ${{ steps.meta.outputs.dependency-names }}
        run: |
          set -euo pipefail
          # The label is created on demand so the workflow needs no repository
          # setup before its first run. Only "already exists" is ignored when
          # creating it, and every other refusal is printed rather than
          # swallowed, but none of them fails the run: the update is left for
          # a person whether or not GitHub lets this workflow say so.
          flag_error=""
          flag() { # pull request, label, colour, description, comment
            local out step
            if ! out="$(gh label create "$2" --color "$3" --description "$4" 2>&1)" &&
               [[ "${out}" != *"already exists"* ]]; then
              step="not labelled"
            elif ! out="$(gh api --method POST "repos/${GH_REPO}/issues/$1/labels" -f "labels[]=$2" 2>&1 > /dev/null)"; then
              step="not labelled"
            elif ! out="$(gh api --method POST "repos/${GH_REPO}/issues/$1/comments" -f body="$5" 2>&1 > /dev/null)"; then
              step="labelled, but not commented"
            else
              return 0
            fi
            # Printed to the log and the run summary, so only plain
            # characters: nothing that could start a workflow command.
            flag_error="${step}: $(printf '%s' "${out}" | tr '\n' ' ' | tr -cd 'A-Za-z0-9 ._/(),+?-' | head -c 160 || true)"
            return 1
          }
          if ! flag "${PR_NUMBER}" "dexcode:major-update" "B60205" \
              "Major dependency update — DexCode will not merge this automatically" \
              "DexCode did not merge this automatically: \`${DEPENDENCY}\` is a major update, and a passing check run is weak evidence that a major bump is safe. Review it and merge when you are happy."; then
            echo "::notice::#${PR_NUMBER} is a major update left for a person (${flag_error})"
          fi

  # The same policy, applied to pull requests that were already open. The event
  # path above cannot reach them: a pull request opened before this workflow
  # was installed never sends an event, so without this the existing backlog is
  # never touched and only new updates are handled.
  sweep:
    # See the guard job: the CI gates exclude this exact check name.
    name: dexcode-dependabot-sweep
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      # As in the guard job: creates labels; labelling a pull request is
      # attempted and may be refused, which the sweep reports and survives.
      issues: write
      # REST check runs and commit statuses need these reads. The GraphQL
      # statusCheckRollup field also traverses Actions workflowRun, which needs
      # a different permission and fails even with both of these granted.
      checks: read
      statuses: read
      # A GitHub OIDC token for DexCode's merge endpoint. DexCode merges with
      # its GitHub App token: a merge made with this workflow's GITHUB_TOKEN
      # starts no CI and no deployment on the default branch.
      id-token: write
    steps:
      - name: Apply the policy to every open Dependabot pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          DEXCODE_MERGE_URL: https://dexcode.ai/api/v1/dependabot/merge
        # dependabot/fetch-metadata reads the pull_request event payload, so it
        # cannot help here. The bump is read from the metadata block in
        # Dependabot's own commit message instead, which is the only thing
        # this needs to decide: the policy branches on major against everything
        # else, and nothing below checks out or runs the pull request's code.
        run: |
          set -euo pipefail
          prs="${RUNNER_TEMP:-/tmp}/dexcode-dependabot.json"
          ci="$(mktemp -d "${RUNNER_TEMP:-/tmp}/dexcode-ci.XXXXXX")"

          # No body: it carries the dependency's release notes, which mention
          # other packages' versions. No commits either: they are read one
          # pull request at a time through REST, since 100 pull requests times
          # their commits times each commit's authors approaches GitHub's
          # GraphQL node limit.
          gh pr list \
            --author "app/dependabot" \
            --state open \
            --limit 100 \
            --json number,title,labels,files,mergeStateStatus,headRefOid \
            > "${prs}"

          # Set when a pull request could not be queued for a reason that is
          # about the repository rather than that pull request. The sweep keeps
          # going — reading and reporting the others still works, and stopping
          # at the first one meant a single misconfigured branch hid the whole
          # backlog — and reports it at the end.
          blocked=""
          # Set once an update merges outright in this run. Each merge moves
          # main under the rest of the list: sibling updates often edit the
          # same lockfile lines and conflict, and GitHub recomputes merge
          # state lazily. So one update merges per run; the next sweep reads
          # the others against the new main. It also gives each merge's
          # deployment time to finish before the next lands.
          merged=""
          # Set when DexCode answers 429; no further requests this run.
          throttled=""
          # Set when a request was sent but its outcome is unknown: no answer,
          # a timeout, a server error, or an answer this guard cannot read.
          # DexCode may still have merged that update and moved main, so it
          # counts as a merge: no further requests this run.
          uncertain=""
          # Every pull request this run leaves open is named in the run
          # summary with its reason, so a green run cannot quietly skip one
          # for ever. Ops separately flags Dependabot pull requests that stay
          # open for more than seven days.
          left=""
          acted=""
          leave() {
            echo "$1"
            left="${left}- ${1#::notice::}"$'\n'
          }
          # Label and comment on a pull request, as a courtesy: the update is
          # left alone either way. GitHub refuses both to a token without
          # `pull-requests: write`, which this workflow does not hold (it
          # answered HTTP 403 on dayz.cx), so a refusal is reported in
          # flag_error and never ends the run. Version 1.6.1 exited here, which
          # failed dayz.cx's sweep on every run from 5 October and skipped the
          # run summary and every update after the refused one.
          flag_error=""
          flag() { # pull request, label, colour, description, comment
            local out step
            if ! out="$(gh label create "$2" --color "$3" --description "$4" 2>&1)" &&
               [[ "${out}" != *"already exists"* ]]; then
              step="not labelled"
            elif ! out="$(gh api --method POST "repos/${GH_REPO}/issues/$1/labels" -f "labels[]=$2" 2>&1 > /dev/null)"; then
              step="not labelled"
            elif ! out="$(gh api --method POST "repos/${GH_REPO}/issues/$1/comments" -f body="$5" 2>&1 > /dev/null)"; then
              step="labelled, but not commented"
            else
              return 0
            fi
            # Printed to the log and the run summary, so only plain
            # characters: nothing that could start a workflow command.
            flag_error="${step}: $(printf '%s' "${out}" | tr '\n' ' ' | tr -cd 'A-Za-z0-9 ._/(),+?-' | head -c 160 || true)"
            return 1
          }

          total="$(jq 'length' "${prs}")"
          echo "Open Dependabot pull requests: ${total}"

          for row in $(jq -r '.[] | @base64' "${prs}"); do
            pr="$(echo "${row}" | base64 --decode)"
            number="$(echo "${pr}" | jq -r '.number')"
            title="$(echo "${pr}" | jq -r '.title')"
            labelled="$(echo "${pr}" | jq -r '[.labels[].name] | index("dexcode:major-update") != null')"

            # An auto-merge queued by a guard before 1.6.0 is not a reason to
            # skip: GitHub would complete it as this workflow's token, which
            # starts no CI or deployment. DexCode merges it like any other.
            # DexCode publishes its own files and verifies them byte for byte
            # before each planning run, so merging a bump inside one marks the
            # installation drifted and every run afterwards is refused. Same
            # rule as the event path above.
            managed="$(echo "${pr}" | jq -r '[.files[].path | select(test("^\\.github/workflows/dexcode_|^\\.dex/|^\\.dex-implementation/|^\\.github/workflows/platform-deploy\\.yml$|^\\.ops-agent/"))] | join(", ")')"
            if [ -n "${managed}" ]; then
              note=""
              if ! echo "${pr}" | jq -e '[.labels[].name] | index("dexcode:managed-file")' >/dev/null; then
                if ! flag "${number}" "dexcode:managed-file" "0E8A16" \
                    "Changes a DexCode- or Ops-managed file — update the template instead" \
                    "DexCode will not merge this: it changes \`${managed}\`, which is published from a DexCode or Ops template. DexCode verifies its own files byte for byte before each planning run, so merging would mark this repository's installation as drifted and refuse every planning run; Ops renders the deploy workflow and agent relay. The pin moves in a template release instead."; then
                  note=" (${flag_error})"
                fi
              fi
              leave "#${number}: left alone, changes managed ${managed}${note}"
              continue
            fi

            # After the managed-file check, not before it. A pull request
            # already carrying dexcode:major-update short-circuited here and
            # never got the managed-file label, so the one reason that must
            # never be reviewed away — merging it breaks every planning run —
            # was missing from exactly the pull requests a person is most
            # likely to read and merge anyway.
            if [ "${labelled}" = "true" ]; then
              leave "#${number}: already labelled for review"
              continue
            fi

            # Dependabot's commit message carries the metadata block that
            # dependabot/fetch-metadata reads on the event path: an
            # `updated-dependencies:` list with one `update-type` for every
            # dependency. DexCode decides from exactly that record, in the head
            # commit alone, so the sweep reads it the same way: the head
            # commit's block, nothing outside it and nothing from an earlier
            # commit. The title and body do not decide. The body carries the
            # dependency's release notes, and a changelog that says "bump
            # other-library from 17 to 18" made dayz.cx's openai 7.25.0 to
            # 7.27.0 look like a major. Any single major in a grouped update
            # makes the whole group a major: the group merges as one commit, so
            # the most dangerous member decides.
            commit_head="$(echo "${pr}" | jq -r '.headRefOid')"
            if ! message="$(gh api --paginate "repos/${GH_REPO}/pulls/${number}/commits?per_page=100" \
                  | jq -r --arg head "${commit_head}" '.[] | select(.sha == $head) | .commit.message')"; then
              blocked="Could not read the commits of #${number}, so its update type is unknown; refusing to guess."
              leave "#${number}: waiting, its commits could not be read"
              continue
            fi
            if [ -z "${message}" ]; then
              leave "#${number}: waiting, its head commit is not in its commit list yet"
              continue
            fi
            # One word per updated dependency: its update type, or "-" when the
            # entry names none (an indirect dependency has no update-type) or
            # names two. "-" cannot be a type, which DexCode's parser reads as
            # [a-z]+. Nothing is printed unless the block is whole and well
            # formed. The message goes in as a here-string, not a pipe: awk
            # stops reading at the closing line, and under pipefail a writer
            # killed by the closed pipe would fail the assignment.
            entry_types="$(awk '
              { sub(/\r$/, "") }
              !inside && $0 == "updated-dependencies:" { inside = 1; next }
              inside && $0 == "..." { closed = 1; exit }
              inside && /^- dependency-name:/ { entries++; kind[entries] = "-"; typed[entries] = 0; next }
              inside && /^  update-type: version-update:semver-[a-z]+$/ {
                if (entries == 0) { bad = 1 }
                else if (typed[entries]) { kind[entries] = "-" }
                else { value = $0; sub(/^.*semver-/, "", value); kind[entries] = value; typed[entries] = 1 }
                next
              }
              END { if (closed && !bad) for (i = 1; i <= entries; i++) print kind[i] }
            ' <<< "${message}")"

            is_major="false"
            if grep -qx 'major' <<< "${entry_types}"; then
              is_major="true"
            elif [ -n "${entry_types}" ] && ! grep -qvxE 'minor|patch' <<< "${entry_types}"; then
              : # every updated dependency is a patch or a minor
            else
              # No update type: an update of an indirect dependency, which
              # Dependabot records without one, or a commit that is not
              # Dependabot's. The title is the only text left that Dependabot
              # wrote, "Bump x from 1.2.3 to 2.0.0" with or without a
              # conventional commit prefix. A grouped update's title has no
              # versions at all, and then there is nothing to decide from.
              # DexCode asks the same question of the commit and refuses what
              # it cannot classify, so this only avoids asking in vain.
              versions="$(printf '%s\n' "${title}" \
                | grep -oiE 'from[[:space:]]+v?[0-9]+[^[:space:]]*[[:space:]]+to[[:space:]]+v?[0-9]+[^[:space:]]*' \
                || true)"
              if [ -z "${versions}" ]; then
                leave "::notice::#${number} left alone: no update type in its commit metadata and no version range in its title"
                continue
              fi
              while IFS= read -r range; do
                [ -z "${range}" ] && continue
                if [[ "${range}" =~ from[[:space:]]+v?([0-9]+)[^[:space:]]*[[:space:]]+to[[:space:]]+v?([0-9]+)[^[:space:]]* ]]; then
                  if [ "${BASH_REMATCH[1]}" != "${BASH_REMATCH[2]}" ]; then
                    is_major="true"
                    break
                  fi
                fi
              done <<< "${versions}"
            fi

            if [ "${is_major}" = "true" ]; then
              # Same treatment a major gets on the event path: labelled when
              # GitHub allows it, never merged, and the comment happens once
              # because the label above is checked first.
              if flag "${number}" "dexcode:major-update" "B60205" \
                  "Major dependency update — DexCode will not merge this automatically" \
                  "DexCode did not merge this automatically: this is a major update, and a passing check run is weak evidence that a major bump is safe. Review it and merge when you are happy."; then
                leave "#${number}: labelled as a major update"
              else
                leave "#${number}: left alone, a major update (${flag_error})"
              fi
              continue
            fi

            # 0.x is treated as the event path treats it. fetch-metadata calls
            # 0.1.0 to 0.2.0 a minor update, and a sweep that disagreed with
            # the event path would make the outcome depend on which one got
            # there first.
            #
            # GitHub's merge state decides whether this merges, not a reading
            # of individual statuses. gh merges outright when the state is
            # CLEAN, HAS_HOOKS or UNSTABLE, and UNSTABLE means a check is
            # still running or has failed, so that one must never reach it.
            # CLEAN with nothing but this workflow's own check is no evidence
            # either. --match-head-commit stops a push made after this list
            # was read from merging on the strength of the old head's checks.
            #
            # Decide from this pull request's current state, not the list's:
            # the list was read before anything in this run changed main.
            # GitHub works the state out on request, so a read just after main
            # moved reports UNKNOWN. Asking again gives it time.
            pr="$(gh pr view "${number}" --json mergeStateStatus,headRefOid)"
            state="$(echo "${pr}" | jq -r '.mergeStateStatus')"
            for _ in 1 2 3 4 5; do
              [ "${state}" = "UNKNOWN" ] || break
              sleep 3
              pr="$(gh pr view "${number}" --json mergeStateStatus,headRefOid)"
              state="$(echo "${pr}" | jq -r '.mergeStateStatus')"
            done
            case "${state}" in
              CLEAN|HAS_HOOKS)
                if [ -n "${merged}" ]; then
                  leave "#${number}: waiting, #${merged} merged earlier in this sweep and main moved; the next sweep reads it again"
                  continue
                fi
                if [ -n "${uncertain}" ]; then
                  leave "#${number}: waiting, the request for #${uncertain} had no clear answer and may have merged; the next sweep reads it again"
                  continue
                fi
                if [ -n "${throttled}" ]; then
                  leave "#${number}: waiting, DexCode asked this repository to slow down"
                  continue
                fi
                ;;
              *)
                if [ "${state}" = "DIRTY" ]; then
                  echo "::warning::#${number} conflicts with the default branch. Dependabot usually rebases it; if it stays this way, it needs a person."
                fi
                leave "#${number}: waiting, merge state ${state}"
                continue
                ;;
            esac

            head="$(echo "${pr}" | jq -r '.headRefOid')"
            # The update type was read from the head the list named. If a push
            # moved it since, that reading is about another commit.
            if [ "${head}" != "${commit_head}" ]; then
              leave "#${number}: waiting, its head moved after the sweep read its commits; the next sweep reads it again"
              continue
            fi
            # gh's GraphQL statusCheckRollup expands each checkSuite.workflowRun,
            # which needs Actions read even though checks and statuses are
            # readable. REST reads the two resources directly without expanding
            # workflow runs. A failed, pending, truncated or unreadable response
            # must never become evidence of green CI. Ignore this guard's own
            # jobs: a green guard alone does not establish application CI.
            # Same gate as the event path; keep the two jq programs identical.
            if ! gh api --paginate --slurp "repos/${GH_REPO}/commits/${head}/check-runs?per_page=100" > "${ci}/checks.json" ||
               ! gh api --paginate --slurp "repos/${GH_REPO}/commits/${head}/status?per_page=100" > "${ci}/statuses.json"; then
              echo "::error::#${number}: cannot read CI for ${head}; refusing auto-merge"
              exit 1
            fi
            # Files, not --argjson: Linux caps one argument at 128 KiB, and a
            # page of check runs with their output text can exceed that.
            if ! passed="$(jq -en --slurpfile c "${ci}/checks.json" --slurpfile s "${ci}/statuses.json" '
              if ($c | length) != 1 or ($s | length) != 1 or
                 ($c[0] | type) != "array" or ($s[0] | type) != "array" or
                 ($c[0] | length) == 0 or ($s[0] | length) == 0
              then error("incomplete CI response") else . end |
              $c[0] as $checks | $s[0] as $statuses |
              if ($checks | any(.[]; (.check_runs | type) != "array" or (.total_count | type) != "number")) or
                 ($checks[0].total_count != ([$checks[].check_runs[]] | length)) or
                 ($statuses | any(.[]; (.statuses | type) != "array" or (.state | type) != "string"))
              then error("incomplete CI response")
              else
                # Jobs of this workflow are neither CI evidence nor blockers.
                [$checks[].check_runs[] | select(.app.slug != "github-actions" or (.name != "dexcode-dependabot-guard" and .name != "dexcode-dependabot-sweep"))] as $runs |
                if any($runs[]; .status != "completed" or (.conclusion != "success" and .conclusion != "neutral" and .conclusion != "skipped")) or
                   ($statuses[0].statuses | length > 0 and $statuses[0].state != "success")
                then 0
                # Before 1.5.3 these jobs were named guard and sweep. A check with
                # either name may be this workflow, so it cannot count as CI
                # evidence, but it may be another workflow, so its failure blocks.
                else ([$runs[] | select(.conclusion == "success") | select(.app.slug != "github-actions" or (.name != "guard" and .name != "sweep"))] | length) +
                     ([$statuses[0].statuses[] | select(.state == "success")] | length)
                end
              end
            ')"; then
              echo "::error::#${number}: incomplete CI response for ${head}; refusing auto-merge"
              exit 1
            fi
            if [ "$passed" -eq 0 ]; then
              leave "::notice::#${number} left alone: no completed, successful CI outside this guard"
              continue
            fi
            # DexCode re-checks all of the above itself and merges with its
            # GitHub App token, pinned to this head. A merge made with this
            # workflow's GITHUB_TOKEN would start no CI and no deployment.
            #
            # One OIDC token per request, since DexCode accepts each token
            # once. Tokens go through private header files so neither appears
            # on a command line.
            http="000"
            sent=""
            if ( umask 077; printf 'Authorization: bearer %s\n' "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" > "${ci}/oidc-headers" ) &&
               token="$(curl -sS --fail --max-time 30 -H "@${ci}/oidc-headers" \
                 "${ACTIONS_ID_TOKEN_REQUEST_URL:-missing}&audience=dexcode:dependabot-guard:merge" | jq -er '.value')" &&
               ( umask 077; printf 'Authorization: Bearer %s\nContent-Type: application/json\n' "${token}" > "${ci}/dexcode-headers" ) &&
               jq -nc --argjson number "${number}" --arg head "${head}" \
                 '{pull_request_number: $number, head_sha: $head}' > "${ci}/request.json"; then
              sent="yes"
              http="$(curl -sS --max-time 120 -o "${ci}/response.json" -w '%{http_code}' \
                -H "@${ci}/dexcode-headers" --data-binary "@${ci}/request.json" "${DEXCODE_MERGE_URL}" || true)"
            fi
            rm -f "${ci}/oidc-headers" "${ci}/dexcode-headers"
            token=""
            case "${http}" in
              200)
                outcome="$(jq -r '.outcome // ""' "${ci}/response.json" 2>/dev/null || true)"
                # Printed to the log and the run summary, so only plain
                # characters: nothing that could start a workflow command.
                reason="$(jq -r '.reason // ""' "${ci}/response.json" 2>/dev/null | tr -cd 'A-Za-z0-9 ._/(),+?-' | head -c 200 || true)"
                case "${outcome}" in
                  merged)
                    merged="${number}"
                    sha="$(jq -r '.merge_commit_sha // ""' "${ci}/response.json" | tr -cd '0-9a-f' | head -c 64)"
                    echo "#${number}: merged by DexCode as ${sha}"
                    acted="${acted}- #${number}: merged by DexCode as ${sha}"$'\n'
                    ;;
                  waiting) leave "#${number}: waiting, DexCode says ${reason}" ;;
                  refused) leave "#${number}: left alone, DexCode says ${reason}" ;;
                  *)
                    uncertain="${number}"
                    echo "::warning::#${number}: DexCode gave an answer this guard does not understand"
                    leave "#${number}: waiting, DexCode's answer could not be read"
                    ;;
                esac
                ;;
              401|403)
                # DexCode does not recognise this repository's guard. Nothing
                # will merge until that is fixed, so the run says so in red.
                blocked="DexCode refused this repository's request (HTTP ${http}). Check that the Dependabot guard installation in DexCode is active and current."
                leave "#${number}: not merged, DexCode refused the request"
                ;;
              429)
                throttled="yes"
                echo "::warning::DexCode asked this repository to slow down; the next sweep continues"
                leave "#${number}: waiting, DexCode asked this repository to slow down"
                ;;
              *)
                # Without an identity token nothing was sent, so nothing can
                # have merged. Once a request has gone, DexCode may have merged
                # it before the answer was lost.
                if [ -n "${sent}" ]; then
                  uncertain="${number}"
                fi
                echo "::warning::#${number}: DexCode could not be reached or failed (HTTP ${http}); the next sweep asks again"
                leave "#${number}: waiting, DexCode was unavailable"
                ;;
            esac
          done

          {
            echo "### Dependabot sweep"
            echo
            echo "Open Dependabot pull requests: ${total}"
            if [ -n "${acted}" ]; then
              echo
              echo "Merged or queued in this run:"
              echo
              printf '%s' "${acted}"
            fi
            if [ -n "${left}" ]; then
              echo
              echo "Left open, with the reason:"
              echo
              printf '%s' "${left}"
            fi
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"

          if [ -n "${blocked}" ]; then
            echo "::error::${blocked}"
            exit 1
          fi
