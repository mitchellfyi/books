# Managed by DexCode template dependabot-guard@1.5.3. Edit the template, not this file.
#
# What this does, and deliberately does not do.
#
# Patch and minor updates are handed to GitHub's own auto-merge, and only when
# GitHub's merge state says the merge will wait for green or already is green.
# That matters because `gh pr merge --auto` merges outright whenever GitHub
# reports a pull request as immediately mergeable, and without required checks
# that includes one whose checks are still running or have failed. Before 1.5.0
# this merged one repository's Rails update 14 seconds after Dependabot
# opened it, ahead of a CI run that then failed.
#
# So the merge state and CI both decide. BLOCKED or BEHIND can queue behind
# branch protection only after another CI check passed on the exact head;
# CLEAN or HAS_HOOKS can merge only after independent CI passed. Failed,
# pending, absent or unreadable checks never authorize a merge. Anything else
# waits for the scheduled sweep to look again.
#
# Major updates are never merged here. A major bump can pass every check and
# still change behaviour, and a dependency file is the one place where a green
# tick is weakest evidence. They are labelled and left for a person.
#
# Nothing in this workflow checks out or executes the pull request's code. It
# reads Dependabot's own metadata and calls the GitHub API, which is why it can
# hold write permission safely on a branch it did not review.
name: DexCode Dependabot guard

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # A pull request opened before this workflow existed will never send an
  # event, so without a sweep the whole backlog sits untouched for ever and
  # only new updates are handled. The offset minute is deliberate: GitHub drops
  # scheduled runs that pile up on the hour.
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

# Least privilege at the root; the jobs that need write say so themselves.
permissions: {}

concurrency:
  # One group per pull request for the event path, one for the whole sweep.
  # Sharing a group would let a sweep cancel the guard that a freshly opened
  # pull request just started.
  group: dexcode-dependabot-${{ github.event.pull_request.number || 'sweep' }}
  cancel-in-progress: true

jobs:
  guard:
    # Check-run names are job names, not workflow-qualified names. These two
    # names identify this workflow's own checks in the CI gates below, so they
    # must not be generic words such as "guard" that another workflow may use.
    name: dexcode-dependabot-guard
    # Author, not title: anyone can open a pull request called "bump x".
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # Labels are an issues resource even on a pull request, so adding one
      # needs issues: write. Without it `gh label create` is denied and the
      # add-label step then fails with "not found", which reads like a missing
      # label rather than a missing permission.
      issues: write
      # GitHub's merge state is computed from the pull request's checks and
      # commit statuses, which a token without these cannot read.
      checks: read
      statuses: read
    steps:
      - name: Read Dependabot's metadata for this pull request
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # DexCode's own files are published by DexCode and verified byte for
      # byte before a planning run is given its specification. An action pin
      # inside dexcode_plan.yml is part of that published content, so merging
      # Dependabot's bump of it changes the checksum, marks the installation
      # drifted, and every planning run afterwards is refused with a bare 401.
      #
      # The pin is DexCode's to move, in a template release. Not this
      # repository's, and not one dependency at a time.
      - name: Check whether this touches DexCode's managed files
        id: managed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          touched="$(gh pr view "${PR_NUMBER}" --json files \
            --jq '[.files[].path | select(test("^\\.github/workflows/dexcode_|^\\.dex/|^\\.dex-implementation/|^\\.github/workflows/platform-deploy\\.yml$|^\\.ops-agent/"))] | join(", ")')"
          if [ -n "${touched}" ]; then
            echo "touched=true" >> "${GITHUB_OUTPUT}"
            echo "paths=${touched}" >> "${GITHUB_OUTPUT}"
          else
            echo "touched=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Leave a DexCode-managed file for a template release
        if: steps.managed.outputs.touched == 'true'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PATHS: ${{ steps.managed.outputs.paths }}
        run: |
          set -euo pipefail
          if ! output="$(gh label create "dexcode:managed-file" \
                --color "0E8A16" \
                --description "Changes a DexCode- or Ops-managed file — update the template instead" 2>&1)"; then
            case "${output}" in
              *"already exists"*) : ;;
              *) echo "::error::Could not create the label: ${output}"; exit 1 ;;
            esac
          fi
          if ! gh pr view "$PR_URL" --json labels --jq '[.labels[].name]' | grep -q "dexcode:managed-file"; then
            gh pr edit "$PR_URL" --add-label "dexcode:managed-file"
            gh pr comment "$PR_URL" --body "DexCode will not merge this: it changes \`${PATHS}\`, which is published from a DexCode or Ops template. DexCode verifies its own files byte for byte before each planning run, so merging would mark this repository's installation as drifted and refuse every planning run; Ops renders the deploy workflow and agent relay, and GitHub will not let this workflow merge workflow changes. The pin moves in a template release instead."
          fi
          echo "::notice::Left alone: changes managed ${PATHS}"

      - name: Enable auto-merge for a patch or minor update
        if: |
          steps.managed.outputs.touched != 'true' && (
          steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          steps.meta.outputs.update-type == 'version-update:semver-minor')
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # gh infers the repository from a git remote, and nothing is checked
          # out here on purpose. Without this it fails with "not a git
          # repository", which reads like a broken runner rather than a
          # missing argument.
          GH_REPO: ${{ github.repository }}
        # --auto queues the merge behind the required checks, but only when
        # there are some: gh merges outright when GitHub calls the pull request
        # mergeable now, and with no required check that includes one whose
        # checks are still running — this job's own check among them. Queue
        # only while branch protection is holding it (BLOCKED or BEHIND),
        # and only after another CI check has passed on this exact head.
        # Otherwise the scheduled sweep rechecks CI. Squash keeps one commit
        # per update.
        #
        # It needs "Allow auto-merge" enabled on the repository. Without it
        # this fails with a GraphQL error naming an API mutation, which tells
        # nobody what to switch on. The workflow names the setting instead.
        run: |
          set -euo pipefail
          # GitHub works the state out on request, so the first read of a new
          # pull request usually says UNKNOWN. Asking again gives it time.
          state="UNKNOWN"
          for _ in 1 2 3 4 5; do
            state="$(gh pr view "$PR_URL" --json mergeStateStatus --jq '.mergeStateStatus')"
            [ "$state" = "UNKNOWN" ] || break
            sleep 3
          done
          case "$state" in
            BLOCKED|BEHIND) ;;
            *)
              echo "::notice::Not queued: merge state ${state}. The scheduled sweep will check CI before merging."
              exit 0
              ;;
          esac
          # A review-only branch rule can also report BLOCKED. Do not queue
          # auto-merge until a real CI check on this exact head has passed.
          # The sweep below applies the same gate; keep the two jq programs
          # identical.
          ci="$(mktemp -d "${RUNNER_TEMP:-/tmp}/dexcode-ci.XXXXXX")"
          if ! gh api --paginate --slurp "repos/${GH_REPO}/commits/${HEAD_SHA}/check-runs?per_page=100" > "${ci}/checks.json" ||
             ! gh api --paginate --slurp "repos/${GH_REPO}/commits/${HEAD_SHA}/status?per_page=100" > "${ci}/statuses.json"; then
            echo "::error::Cannot read CI for ${HEAD_SHA}; refusing auto-merge"
            exit 1
          fi
          # Files, not --argjson: Linux caps one argument at 128 KiB, and a
          # page of check runs with their output text can exceed that.
          if ! passed="$(jq -en --slurpfile c "${ci}/checks.json" --slurpfile s "${ci}/statuses.json" '
            if ($c | length) != 1 or ($s | length) != 1 or
               ($c[0] | type) != "array" or ($s[0] | type) != "array" or
               ($c[0] | length) == 0 or ($s[0] | length) == 0
            then error("incomplete CI response") else . end |
            $c[0] as $checks | $s[0] as $statuses |
            if ($checks | any(.[]; (.check_runs | type) != "array" or (.total_count | type) != "number")) or
               ($checks[0].total_count != ([$checks[].check_runs[]] | length)) or
               ($statuses | any(.[]; (.statuses | type) != "array" or (.state | type) != "string"))
            then error("incomplete CI response")
            else
              # Jobs of this workflow are neither CI evidence nor blockers.
              [$checks[].check_runs[] | select(.app.slug != "github-actions" or (.name != "dexcode-dependabot-guard" and .name != "dexcode-dependabot-sweep"))] as $runs |
              if any($runs[]; .status != "completed" or (.conclusion != "success" and .conclusion != "neutral" and .conclusion != "skipped")) or
                 ($statuses[0].statuses | length > 0 and $statuses[0].state != "success")
              then 0
              # Before 1.5.3 these jobs were named guard and sweep. A check with
              # either name may be this workflow, so it cannot count as CI
              # evidence, but it may be another workflow, so its failure blocks.
              else ([$runs[] | select(.conclusion == "success") | select(.app.slug != "github-actions" or (.name != "guard" and .name != "sweep"))] | length) +
                   ([$statuses[0].statuses[] | select(.state == "success")] | length)
              end
            end
          ')"; then
            echo "::error::Incomplete CI response for ${HEAD_SHA}; refusing auto-merge"
            exit 1
          fi
          if [ "$passed" -eq 0 ]; then
            echo "::notice::Not queued: no successful CI check on ${HEAD_SHA}"
            exit 0
          fi
          if ! output="$(gh pr merge --auto --squash --match-head-commit "$HEAD_SHA" "$PR_URL" 2>&1)"; then
            case "$output" in
              *"Auto merge is not allowed"*)
                echo "::error::Enable Settings → General → Allow auto-merge on this repository. Until then DexCode can only merge updates whose checks have already passed."
                gh pr comment "$PR_URL" --body "DexCode could not queue this update: **Allow auto-merge** is turned off for this repository (Settings → General). Turn it on and this will merge itself once the required checks pass." || true
                exit 1
                ;;
              *) echo "::error::$output"; exit 1 ;;
            esac
          fi
          echo "$output"

      - name: Leave a major update for a person
        if: |
          steps.managed.outputs.touched != 'true' &&
          steps.meta.outputs.update-type == 'version-update:semver-major'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          DEPENDENCY: ${{ steps.meta.outputs.dependency-names }}
        run: |
          set -euo pipefail
          # Created on demand so the workflow needs no repository setup before
          # its first run. Only an "already exists" failure is ignored: the
          # first version of this swallowed every error, so a permissions
          # problem surfaced two lines later as a label that did not exist.
          if ! output="$(gh label create "dexcode:major-update" \
                --color "B60205" \
                --description "Major dependency update — DexCode will not merge this automatically" 2>&1)"; then
            case "$output" in
              *"already exists"*) : ;;
              *) echo "::error::Could not create the label: $output"; exit 1 ;;
            esac
          fi
          gh pr edit "$PR_URL" --add-label "dexcode:major-update"
          gh pr comment "$PR_URL" --body "DexCode did not merge this automatically: \`${DEPENDENCY}\` is a major update, and a passing check run is weak evidence that a major bump is safe. Review it and merge when you are happy."

  # The same policy, applied to pull requests that were already open. The event
  # path above cannot reach them: a pull request opened before this workflow
  # was installed never sends an event, so without this the existing backlog is
  # never touched and only new updates are handled.
  sweep:
    # See the guard job: the CI gates exclude this exact check name.
    name: dexcode-dependabot-sweep
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      # REST check runs and commit statuses need these reads. The GraphQL
      # statusCheckRollup field also traverses Actions workflowRun, which needs
      # a different permission and fails even with both of these granted.
      checks: read
      statuses: read
    steps:
      - name: Apply the policy to every open Dependabot pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        # dependabot/fetch-metadata reads the pull_request event payload, so it
        # cannot help here. The bump is read from Dependabot's own title
        # instead, which is the only thing this needs to decide: the policy
        # branches on major against everything else, and nothing below checks
        # out or runs the pull request's code.
        run: |
          set -euo pipefail
          prs="${RUNNER_TEMP:-/tmp}/dexcode-dependabot.json"
          ci="$(mktemp -d "${RUNNER_TEMP:-/tmp}/dexcode-ci.XXXXXX")"

          gh pr list \
            --author "app/dependabot" \
            --state open \
            --limit 100 \
            --json number,title,body,labels,files,autoMergeRequest,mergeStateStatus,headRefOid \
            > "${prs}"

          # Set when a pull request could not be queued for a reason that is
          # about the repository rather than that pull request. The sweep keeps
          # going — labelling majors still works, and stopping at the first one
          # meant a single misconfigured branch hid the whole backlog — and
          # reports it at the end.
          blocked=""

          total="$(jq 'length' "${prs}")"
          echo "Open Dependabot pull requests: ${total}"

          for row in $(jq -r '.[] | @base64' "${prs}"); do
            pr="$(echo "${row}" | base64 --decode)"
            number="$(echo "${pr}" | jq -r '.number')"
            title="$(echo "${pr}" | jq -r '.title')"
            body="$(echo "${pr}" | jq -r '.body // ""')"
            queued="$(echo "${pr}" | jq -r '.autoMergeRequest != null')"
            labelled="$(echo "${pr}" | jq -r '[.labels[].name] | index("dexcode:major-update") != null')"

            if [ "${queued}" = "true" ]; then
              echo "#${number}: auto-merge already queued"
              continue
            fi
            # DexCode publishes its own files and verifies them byte for byte
            # before each planning run, so merging a bump inside one marks the
            # installation drifted and every run afterwards is refused. Same
            # rule as the event path above.
            managed="$(echo "${pr}" | jq -r '[.files[].path | select(test("^\\.github/workflows/dexcode_|^\\.dex/|^\\.dex-implementation/|^\\.github/workflows/platform-deploy\\.yml$|^\\.ops-agent/"))] | join(", ")')"
            if [ -n "${managed}" ]; then
              if ! echo "${pr}" | jq -e '[.labels[].name] | index("dexcode:managed-file")' >/dev/null; then
                if ! output="$(gh label create "dexcode:managed-file" \
                      --color "0E8A16" \
                      --description "Changes a DexCode- or Ops-managed file — update the template instead" 2>&1)"; then
                  case "${output}" in
                    *"already exists"*) : ;;
                    *) echo "::error::Could not create the label: ${output}"; exit 1 ;;
                  esac
                fi
                gh pr edit "${number}" --add-label "dexcode:managed-file"
                gh pr comment "${number}" --body "DexCode will not merge this: it changes \`${managed}\`, which is published from a DexCode or Ops template. DexCode verifies its own files byte for byte before each planning run, so merging would mark this repository's installation as drifted and refuse every planning run; Ops renders the deploy workflow and agent relay, and GitHub will not let this workflow merge workflow changes. The pin moves in a template release instead."
              fi
              echo "#${number}: left alone, changes managed ${managed}"
              continue
            fi

            # After the managed-file check, not before it. A pull request
            # already carrying dexcode:major-update short-circuited here and
            # never got the managed-file label, so the one reason that must
            # never be reviewed away — merging it breaks every planning run —
            # was missing from exactly the pull requests a person is most
            # likely to read and merge anyway.
            if [ "${labelled}" = "true" ]; then
              echo "#${number}: already labelled for review"
              continue
            fi

            # "Bump x from 1.2.3 to 2.0.0", with or without a conventional
            # commit prefix. A grouped update says "bump the all-actions group
            # with 7 updates" and carries no versions in its title at all —
            # most of one repository's backlog was that shape — so the body is
            # read too, where Dependabot lists every bump it made. Any single
            # major in a group makes the whole group a major: the group merges
            # as one commit, so the most dangerous member decides.
            versions="$(printf '%s\n%s' "${title}" "${body}" \
              | grep -oiE 'from[[:space:]]+v?[0-9]+[^[:space:]]*[[:space:]]+to[[:space:]]+v?[0-9]+[^[:space:]]*' \
              || true)"
            if [ -z "${versions}" ]; then
              echo "::notice::#${number} left alone: no version range in its title or body (\"${title}\")"
              continue
            fi

            is_major="false"
            while IFS= read -r range; do
              [ -z "${range}" ] && continue
              if [[ "${range}" =~ from[[:space:]]+v?([0-9]+)[^[:space:]]*[[:space:]]+to[[:space:]]+v?([0-9]+)[^[:space:]]* ]]; then
                if [ "${BASH_REMATCH[1]}" != "${BASH_REMATCH[2]}" ]; then
                  is_major="true"
                  break
                fi
              fi
            done <<< "${versions}"

            if [ "${is_major}" = "true" ]; then
              # Same treatment a major gets on the event path: labelled, never
              # merged, and the comment happens once because the label above is
              # checked first.
              if ! output="$(gh label create "dexcode:major-update" \
                    --color "B60205" \
                    --description "Major dependency update — DexCode will not merge this automatically" 2>&1)"; then
                case "${output}" in
                  *"already exists"*) : ;;
                  *) echo "::error::Could not create the label: ${output}"; exit 1 ;;
                esac
              fi
              gh pr edit "${number}" --add-label "dexcode:major-update"
              gh pr comment "${number}" --body "DexCode did not merge this automatically: this is a major update, and a passing check run is weak evidence that a major bump is safe. Review it and merge when you are happy."
              echo "#${number}: labelled as a major update"
              continue
            fi

            # 0.x is treated as the event path treats it. fetch-metadata calls
            # 0.1.0 to 0.2.0 a minor update, and a sweep that disagreed with
            # the event path would make the outcome depend on which one got
            # there first.
            #
            # GitHub's merge state decides whether this merges, not a reading
            # of individual statuses. gh merges outright when the state is
            # CLEAN, HAS_HOOKS or UNSTABLE, and UNSTABLE means a check is
            # still running or has failed, so that one must never reach it.
            # CLEAN with nothing but this workflow's own check is no evidence
            # either. --match-head-commit stops a push made after this list
            # was read from merging on the strength of the old head's checks.
            #
            # GitHub works the state out on request, so a list read just after
            # main moved reports UNKNOWN. Asking again gives it time.
            state="$(echo "${pr}" | jq -r '.mergeStateStatus')"
            for _ in 1 2 3 4 5; do
              [ "${state}" = "UNKNOWN" ] || break
              sleep 3
              pr="$(gh pr view "${number}" --json mergeStateStatus,headRefOid)"
              state="$(echo "${pr}" | jq -r '.mergeStateStatus')"
            done
            case "${state}" in
              BLOCKED|BEHIND) outcome="auto-merge queued" ;;
              CLEAN|HAS_HOOKS) outcome="merge requested" ;;
              *)
                echo "#${number}: waiting, merge state ${state}"
                continue
                ;;
            esac

            head="$(echo "${pr}" | jq -r '.headRefOid')"
            # gh's GraphQL statusCheckRollup expands each checkSuite.workflowRun,
            # which needs Actions read even though checks and statuses are
            # readable. REST reads the two resources directly without expanding
            # workflow runs. A failed, pending, truncated or unreadable response
            # must never become evidence of green CI. Ignore this guard's own
            # jobs: a green guard alone does not establish application CI.
            # Same gate as the event path; keep the two jq programs identical.
            if ! gh api --paginate --slurp "repos/${GH_REPO}/commits/${head}/check-runs?per_page=100" > "${ci}/checks.json" ||
               ! gh api --paginate --slurp "repos/${GH_REPO}/commits/${head}/status?per_page=100" > "${ci}/statuses.json"; then
              echo "::error::#${number}: cannot read CI for ${head}; refusing auto-merge"
              exit 1
            fi
            # Files, not --argjson: Linux caps one argument at 128 KiB, and a
            # page of check runs with their output text can exceed that.
            if ! passed="$(jq -en --slurpfile c "${ci}/checks.json" --slurpfile s "${ci}/statuses.json" '
              if ($c | length) != 1 or ($s | length) != 1 or
                 ($c[0] | type) != "array" or ($s[0] | type) != "array" or
                 ($c[0] | length) == 0 or ($s[0] | length) == 0
              then error("incomplete CI response") else . end |
              $c[0] as $checks | $s[0] as $statuses |
              if ($checks | any(.[]; (.check_runs | type) != "array" or (.total_count | type) != "number")) or
                 ($checks[0].total_count != ([$checks[].check_runs[]] | length)) or
                 ($statuses | any(.[]; (.statuses | type) != "array" or (.state | type) != "string"))
              then error("incomplete CI response")
              else
                # Jobs of this workflow are neither CI evidence nor blockers.
                [$checks[].check_runs[] | select(.app.slug != "github-actions" or (.name != "dexcode-dependabot-guard" and .name != "dexcode-dependabot-sweep"))] as $runs |
                if any($runs[]; .status != "completed" or (.conclusion != "success" and .conclusion != "neutral" and .conclusion != "skipped")) or
                   ($statuses[0].statuses | length > 0 and $statuses[0].state != "success")
                then 0
                # Before 1.5.3 these jobs were named guard and sweep. A check with
                # either name may be this workflow, so it cannot count as CI
                # evidence, but it may be another workflow, so its failure blocks.
                else ([$runs[] | select(.conclusion == "success") | select(.app.slug != "github-actions" or (.name != "guard" and .name != "sweep"))] | length) +
                     ([$statuses[0].statuses[] | select(.state == "success")] | length)
                end
              end
            ')"; then
              echo "::error::#${number}: incomplete CI response for ${head}; refusing auto-merge"
              exit 1
            fi
            if [ "$passed" -eq 0 ]; then
              echo "::notice::#${number} left alone: no completed, successful CI outside this guard"
              continue
            fi
            if ! output="$(gh pr merge --auto --squash --match-head-commit "${head}" "${number}" 2>&1)"; then
              case "${output}" in
                *"Auto merge is not allowed"*)
                  blocked="Auto-merge is switched off. Enable Settings → General → Allow auto-merge."
                  continue
                  ;;
                *"Protected branch rules not configured"*)
                  # The merge state said protection was holding this pull
                  # request and GitHub disagrees. Merging anyway would merge
                  # before the checks finish, so report it instead.
                  blocked="The default branch has no protection rule, so there are no required checks for auto-merge to wait for. Updates still merge once GitHub reports every check as passed; add a branch protection rule with at least one required check to queue them sooner."
                  continue
                  ;;
                *"Head branch was modified"*)
                  echo "#${number}: pushed to since the list was read; the next sweep looks again"
                  continue
                  ;;
                *) echo "::error::#${number}: ${output}"; exit 1 ;;
              esac
            fi
            echo "#${number}: ${outcome}"
          done

          if [ -n "${blocked}" ]; then
            echo "::error::${blocked}"
            exit 1
          fi
